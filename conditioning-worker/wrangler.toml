name = "pocket-condition"
main = "dist/worker.js"

# Mirrors what is configured on the Cloudflare side so a deploy does not
# silently revert the dashboard settings (observability/logging, preview URLs
# and the compatibility date). Keep these in sync with the dashboard.
compatibility_date = "2026-11-08"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
# Which provider the grading service calls: "deepseek" or "ollama".
# Both speak the OpenAI chat-completions shape and both support JSON mode,
# vision and reasoning control.
CONDITION_PROVIDER = "deepseek"

# The benchmark lab may override the provider/model, but only for these pairs.
# Keep this list in sync with PocketScanTCG's src/lib/benchmarkTargets.ts.
CONDITION_BENCHMARK_MODELS = "deepseek:deepseek-flash,ollama:gemma4:cloud,ollama:mistral-large-4,ollama:mimo-v2.6-pro"

# Override the model for the chosen provider. Leave unset to use the provider's
# default. DeepSeek: "deepseek-flash" (the only DeepSeek model with vision).
# Ollama vision models tested for PocketScanTCG (five-card identification check):
#   gemma4:cloud     fastest/cheapest, 5/5 name + number
#   glm-5.3-flash    5/5 name + number, close second, strong document vision
#   mimo-v2.6-pro    5/5 name, 3/5 number, fast and mid-priced
#   mistral-large-4  5/5 name, 4/5 number, slowest; 1.6B vision encoder, the
#                    condition-grading candidate
# Gemma 4 wraps its JSON in a <|channel>thought ... <channel|> block; the Worker
# strips it in parseJsonObject before parsing.
# CONDITION_MODEL = "deepseek-flash"
